<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>婚宴報到查位（典雅粉金版）</title>
<style>
  body {
    font-family: "Microsoft JhengHei","Noto Sans TC",sans-serif;
    margin: 20px;
    background: linear-gradient(180deg,#fffafc,#fff4f8);
    color:#3b1f25;
  }
  .wrap { max-width:1000px; margin:0 auto; text-align:center; }
  h2 { color:#b65f7a; margin-bottom:14px; }
  #search {
    width:100%; max-width:400px; padding:10px 14px;
    font-size:16px; border:2px solid #f3c7d3; border-radius:10px;
    background:linear-gradient(90deg,#fff,#fff7f9);
    box-shadow:0 2px 6px rgba(182,95,122,0.1);
  }
  #mapArea {
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 28px;
    justify-items: center;
    margin-top:30px;
  }
  .table {
    width:70px; height:70px;
    border-radius:50%;
    background: radial-gradient(circle at 30% 30%, #fff7fb, #ffe0ec);
    border:3px solid #e7b3c3;
    box-shadow:0 4px 10px rgba(182,95,122,0.25);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition: all .2s ease;
    position:relative;
  }
  .table.highlight {
    transform: scale(1.3);
    box-shadow:0 0 18px rgba(182,95,122,0.45);
    border-color:#ff9ec0;
    z-index:2;
  }
  .table-label {
    margin-top:6px; font-weight:700; color:#6b2237;
  }
  .vip-row, .main-row {
    display:flex; justify-content:center; align-items:center; gap:40px;
    margin-top:14px;
  }
  .infoBox {
    margin-top:24px;
    padding:14px;
    border-radius:12px;
    background:linear-gradient(180deg,#fff,#fff6fa);
    border:1px solid #f3c7d3;
    display:inline-block;
    min-width:260px;
  }
  .title { color:#b65f7a; font-weight:800; margin-bottom:6px; }
  .noRes { color:#777; }
</style>
</head>
<body>
<div class="wrap">
  <h2>婚宴報到查位（典雅粉金版）</h2>
  <input id="search" placeholder="輸入姓名或部分姓名，例如「王啟平」..." />
  
  <!-- 主桌與貴賓桌 -->
  <div class="main-row">
    <div class="table" data-table="貴賓A"><div>貴賓A</div></div>
    <div class="table" data-table="主桌"><div>主桌</div></div>
    <div class="table" data-table="貴賓B"><div>貴賓B</div></div>
  </div>

  <!-- 一般桌次 -->
  <div id="mapArea"></div>

  <div class="infoBox">
    <div class="title" id="infoName">尚未搜尋</div>
    <div id="infoTable">請輸入姓名開始搜尋</div>
    <div id="infoCount" style="margin-top:4px;"></div>
  </div>
  
  <p style="color:#666;font-size:13px;margin-top:8px;">
    若未找到結果，可嘗試輸入部分姓名；如仍查無，請洽新人招待協助。
  </p>
</div>

<script>
let guests = [];

async function loadCSV(){
  try {
    const res = await fetch('wedding_guest_tables.csv');
    const txt = await res.text();
    const lines = txt.trim().split(/\r?\n/);
    lines.shift();
    guests = lines.map(l=>{
      const parts = l.split(',');
      return { table_no: parts[0], name: parts[1], count: parseInt(parts[2]||'1')||1 };
    });
  } catch(e){
    console.warn('無法讀取 CSV', e);
  }
}

function createTables(){
  const map = document.getElementById('mapArea');
  for(let i=1; i<=54; i++){
    const id = String(i).padStart(2,'0');
    const div = document.createElement('div');
    div.className = 'table';
    div.dataset.table = id;
    div.innerHTML = `<div>${id}</div>`;
    div.addEventListener('click', ()=>{ highlightTable(id); showInfoByTable(id); });
    map.appendChild(div);
  }
}

function highlightTable(id){
  document.querySelectorAll('.table').forEach(t=>t.classList.remove('highlight'));
  const el = document.querySelector(`.table[data-table="${id}"]`);
  if(el){ el.classList.add('highlight'); el.scrollIntoView({behavior:'smooth',block:'center'}); }
}

function showInfo(tableId, foundName, count){
  const infoName = document.getElementById('infoName');
  const infoTable= document.getElementById('infoTable');
  const infoCount= document.getElementById('infoCount');
  if(!foundName){
    alert("查無此姓名，請洽新人招待協助。");
    infoName.textContent = '查無結果';
    infoTable.textContent = '';
    infoCount.textContent = '';
    return;
  }
  infoName.textContent = foundName;
  infoTable.textContent = `桌次：${tableId}`;
  infoCount.textContent = `人數：${count}`;
}

function showInfoByTable(tableId){
  const matches = guests.filter(g=> g.table_no == tableId);
  if(matches.length>0){
    const names = matches.map(m=>m.name).slice(0,4).join('、');
    showInfo(tableId, names, matches.reduce((s,m)=>s+m.count,0));
  } else {
    showInfo(tableId, null, 0);
  }
}

function searchName(q){
  if(!q) return null;
  q = q.trim();
  const r = guests.filter(g => g.name && g.name.includes(q));
  return r;
}

document.getElementById('search').addEventListener('input', function(e){
  const q = e.target.value.trim();
  if(!q){
    document.getElementById('infoName').textContent='尚未搜尋';
    document.getElementById('infoTable').textContent='請輸入姓名開始搜尋';
    document.getElementById('infoCount').textContent='';
    document.querySelectorAll('.table').forEach(s=> s.classList.remove('highlight'));
    return;
  }
  const res = searchName(q);
  if(!res || res.length===0){ showInfo('', null); return; }
  const first = res[0];
  highlightTable(first.table_no);
  showInfo(first.table_no, first.name, first.count);
  if(res.length>1){ document.getElementById('infoTable').textContent += `（找到 ${res.length} 筆相似結果）`; }
});

(async function init(){
  await loadCSV();
  createTables();
})();
</script>
</body>
</html>
