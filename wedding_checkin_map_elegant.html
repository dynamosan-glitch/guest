    <style>
        /* CSS 樣式開始 - 網格佈局與粉金主題 */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap'); /* 引入思源宋體 */

        :root {
            --primary-color: #A03131; /* 深紅色 */
            --secondary-color: #FFD700; /* 金色 */
            --pink-base: #fdf2f5; /* 淺粉色背景 */
            --pink-light: #fff5f8;
            --pink-marker: #fad0d8; /* 圓形標記粉色 */
            --gold-border: #ccaa00; /* 金色邊框 */
            --text-color: #333;
        }

        body {
            font-family: 'Noto Serif TC', '微軟正黑體', 'Microsoft JhengHei', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--pink-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-color);
            line-height: 1.6;
        }

        h1 {
            color: var(--primary-color);
            margin: 20px 0 5px 0;
            font-size: 2.2em;
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        .subtitle {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 25px;
        }

        /* 查詢區塊 */
        .search-container {
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin: 10px 0 30px 0;
            width: 90%;
            max-width: 550px;
            text-align: center;
            border-top: 5px solid var(--primary-color);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 17px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: var(--gold-border);
            outline: none;
        }

        button {
            padding: 12px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #8b0000;
        }

        .result-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            min-height: 50px;
            text-align: left;
            font-size: 1.1em;
        }

        .result-box.found {
            background-color: var(--pink-base);
            border: 1px solid #f9c7d4;
            color: var(--primary-color);
            border-left: 5px solid var(--gold-border);
        }

        .result-box.not-found {
            background-color: #fff7f7;
            border: 1px solid #e6c8c8;
            color: #d32f2f;
            border-left: 5px solid #f44336;
        }
        .result-box strong {
            color: var(--gold-border);
            font-weight: 700;
        }
        .result-box .note {
            font-size: 0.9em;
            color: #777;
            display: block;
        }

        /* *** 座位網格佈局 (核心) *** */
        .seating-grid {
            display: grid;
            /* 3 VIP 欄 + 6 數字桌欄 */
            grid-template-columns: repeat(6, 1fr); 
            gap: 15px 10px; /* 垂直 15px，水平 10px */
            width: 95%;
            max-width: 700px;
            margin: 0 auto 30px auto;
            padding: 15px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        /* 標記通用樣式 */
        .seat-marker {
            width: 100%;
            padding-bottom: 100%; /* 使其高度等於寬度，形成正方形/圓形 */
            background-color: var(--pink-marker);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--primary-color);
            font-size: 1.2em;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border: 3px solid transparent;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }
        
        /* 由於我們使用 grid 佈局，需要為 VIP 圓形調整位置 */
        #貴賓A, #主桌, #貴賓B {
            font-size: 1.0em;
            font-weight: bold;
            color: #ffffff; /* VIP 字體為白色 */
            background-color: var(--primary-color); /* VIP 桌為深紅色底 */
            border: 3px solid var(--secondary-color); /* 金色邊框 */
        }

        /* VIP 欄位定位 */
        #貴賓A {
            grid-column: 2 / span 1; /* 佔據第 2 欄 */
        }
        #主桌 {
            grid-column: 3 / span 2; /* 佔據第 3 和 4 欄 */
            border-radius: 10px; /* 主桌為圓角矩形 */
        }
        #貴賓B {
            grid-column: 5 / span 1; /* 佔據第 5 欄 */
        }


        /* 高亮樣式 */
        .highlight {
            background-color: var(--secondary-color) !important; /* 金色高亮 */
            border: 3px solid var(--primary-color) !important;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
            animation: pulse 1.2s infinite alternate;
        }
        /* 高亮時，數字桌號的文字顏色變成深紅色 */
        .highlight.table-number {
             color: var(--primary-color); 
        }
        /* 高亮時，VIP 桌號的文字顏色變成深色 */
        .highlight.vip-table {
             color: var(--primary-color); 
        }

        @keyframes pulse {
            from { opacity: 0.8; }
            to { opacity: 1; }
        }

        /* 額外加上參考座位圖 */
        .map-reference {
            margin-top: 20px;
            width: 95%;
            max-width: 700px;
            text-align: center;
        }
        .map-reference img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* 響應式設計：小屏幕調整 */
        @media (max-width: 768px) {
            .seating-grid {
                grid-template-columns: repeat(3, 1fr); /* 調整為 3 欄佈局 */
                gap: 10px;
                max-width: 500px;
            }
            /* 在 3 欄佈局下重新調整 VIP 欄位 */
            #貴賓A { grid-column: 1 / span 1; }
            #主桌 { grid-column: 2 / span 1; }
            #貴賓B { grid-column: 3 / span 1; }
        }
    </style>
</head>

                if (prevMarker) {
                    prevMarker.classList.remove('highlight');
                    // 恢復 VIP/數字桌的樣式類別
                    if (prevMarker.id === '主桌' || prevMarker.id === '貴賓A' || prevMarker.id === '貴賓B') {
                        prevMarker.classList.add('vip-table');
                        prevMarker.classList.remove('table-number');
                    } else {
                        prevMarker.classList.add('table-number');
                        prevMarker.classList.remove('vip-table');
                    }
                }
                highlightedTableId = null;
            }

            if (input.length < 2) {
                resultBox.innerHTML = '請至少輸入兩個字或以上進行查詢';
                resultBox.className = 'result-box not-found';
                return;
            }

            // 尋找匹配的賓客
            const foundGuests = guestData.filter(guest => {
                // 檢查是否包含輸入的文字 (不區分大小寫)
                return guest.name.toLowerCase().includes(input);
            });

            if (foundGuests.length > 0) {
                let htmlContent = '🎉 查詢結果：';
                
                // 只取第一個匹配的賓客進行地圖高亮，並顯示所有匹配結果
                foundGuests.forEach((guest, index) => {
                    const tableId = formatTableId(guest.table);

                    htmlContent += `
                        <p style="font-weight: bold; margin: 5px 0;">
                            ${index === 0 ? '📍 ' : ''}
                            <span style="color: var(--primary-color);"> ${guest.name} </span>：
                            <strong style="color: var(--gold-border); font-size: 1.2em;">${guest.table} 桌</strong>
                            (${guest.count} 位)
                            ${guest.note ? `<span class="note">[備註: ${guest.note}]</span>` : ''}
                        </p>
                    `;
                    
                    if (index === 0) {
                        // 高亮顯示第一個找到的桌子
                        const marker = document.getElementById(tableId);
                        if (marker) {
                            marker.classList.add('highlight');
                            marker.classList.remove('vip-table', 'table-number'); // 移除舊類別
                            highlightedTableId = tableId;
                            // 可選：讓網格自動捲動到高亮桌子
                            marker.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }
                });

                resultBox.innerHTML = htmlContent;
                resultBox.classList.remove('not-found');
                resultBox.classList.add('found');

            } else {
                resultBox.innerHTML = '找不到您的座位資料，請洽詢現場新人的招待人員協助入座';
                resultBox.classList.remove('found');
                resultBox.classList.add('not-found');
            }
        }

        // 監聽 Enter 鍵 (按下 Enter 時執行查詢)
        function checkSearch(event) {
            if (event.key === "Enter") {
                searchGuest();
            }
        }

        // 當頁面加載完成後
        window.onload = function() {
            document.getElementById('guestNameInput').focus();
        }
    </script>

</body>
</html>
