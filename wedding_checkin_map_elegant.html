        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap'); /* 引入思源宋體，更優雅 */

        :root {
            --primary-color: #A03131; /* 深紅色/酒紅色 */
            --secondary-color: #FFD700; /* 金色/喜慶色 */
            --background-color: #fcfcfc;
            --card-background: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Noto Serif TC', '微軟正黑體', 'Microsoft JhengHei', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-color);
            line-height: 1.6;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 2.2em;
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        h2 {
            color: var(--primary-color);
            font-size: 1.5em;
            margin-top: 5px;
        }
        .subtitle {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 20px;
        }

        .search-container {
            background-color: var(--card-background);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: 20px 0;
            width: 90%;
            max-width: 450px;
            text-align: center;
            border-top: 4px solid var(--primary-color);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 17px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: var(--secondary-color);
            outline: none;
        }

        button {
            padding: 12px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }
        button:hover {
            background-color: #8b0000;
        }
        button:active {
            transform: scale(0.98);
        }

        .result-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            min-height: 50px;
            text-align: left;
            font-size: 1.1em;
        }

        .result-box.found {
            background-color: #f7fff7;
            border: 1px solid #c8e6c9;
            color: #388e3c;
            border-left: 5px solid #4CAF50;
        }

        .result-box.not-found {
            background-color: #fff7f7;
            border: 1px solid #e6c8c8;
            color: #d32f2f;
            border-left: 5px solid #f44336;
        }
        .result-box p {
            margin: 5px 0;
        }
        .result-box strong {
            color: var(--primary-color);
            font-weight: 700;
        }
        .result-box .note {
            font-size: 0.9em;
            color: #777;
            display: block;
        }


        /* 座位地圖容器 */
        .seat-map-container {
            position: relative;
            width: 95%;
            max-width: 800px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border-radius: 10px;
            overflow: hidden;
        }

        .seat-map-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
        }

        /* 座位地標定位與高亮 */
        .seat-marker {
            position: absolute;
            /* 基礎尺寸，調整後更接近圖上桌子大小 */
            width: 4.5%; 
            height: 4.5%;
            background-color: transparent;
            border-radius: 50%;
            transition: all 0.5s ease;
            box-sizing: border-box;
            z-index: 10;
        }

        /* 主桌和貴賓桌的精準定位 */
        #主桌 {
            width: 13%;
            height: 25%;
            border-radius: 5px;
            left: 42%;
            top: 14.5%;
        }

        /* 貴賓桌微調到更精準的中心位置 */
        #貴賓A { left: 34.5%; top: 15.5%; width: 4.5%; height: 4.5%; border-radius: 50%; }
        #貴賓B { left: 60.5%; top: 15.5%; width: 4.5%; height: 4.5%; border-radius: 50%; }

        /* 數字桌號精準定位 - 根據圖片網格進行微調 */
        /* 左側欄 (X軸) */
        .col-28 { left: 28%; } 
        .col-34 { left: 34%; }
        .col-40 { left: 40%; }
        /* 右側欄 (X軸) */
        .col-56 { left: 56%; }
        .col-62 { left: 62%; }
        .col-68 { left: 68%; }

        /* 行高 (Y軸) */
        .row-28 { top: 27.5%; }
        .row-36 { top: 35.5%; }
        .row-44 { top: 43.5%; }
        .row-51 { top: 51.5%; }
        .row-59 { top: 59.5%; }
        .row-67 { top: 67.5%; }
        .row-75 { top: 75.5%; }
        .row-83 { top: 83.5%; }
        .row-91 { top: 91.5%; } /* 最後一排 */

        /* R1 */ #01 { @extend .col-28, .row-28; } #02 { @extend .col-34, .row-28; } #03 { @extend .col-40, .row-28; }

               #22 { @extend .col-56, .row-51; } #23 { @extend .col-62, .row-51; } #24 { @extend .col-68, .row-51; }
        /* R5 */ #25 { @extend .col-28, .row-59; } #26 { @extend .col-34, .row-59; } #27 { @extend .col-40, .row-59; }
               #28 { @extend .col-56, .row-59; } #29 { @extend .col-62, .row-59; } #30 { @extend .col-68, .row-59; }

               #40 { @extend .col-56, .row-75; } #41 { @extend .col-62, .row-75; } #42 { @extend .col-68, .row-75; }
